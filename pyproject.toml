[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "pmev"
version = "0.1.0"
description = "Multi-book +EV scanner (Pinnacle-devigged) for Kalshi and Polymarket."
requires-python = ">=3.12"

[tool.scikit-build]
wheel.packages = ["pmev"]   # one tree: pulls in core, matching, pollers, execution, adapters
